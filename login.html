<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#131313">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <title>RESIST TIK</title>
    <link rel="manifest" href="/manifest.json">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;600;900&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Palette الجديدة */
            --primary: #00E5FF;
            --primary-dark: #00A3E0;
            --secondary: #00A3E0;
            --accent: #00E5FF;

            --bg-body: #131313;
            --bg-card: rgba(30, 41, 59, 0.7);

            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;

            --card-border: rgba(148, 163, 184, 0.1);
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --shadow-glow: 0 0 20px rgba(0, 229, 255, 0.15);

            --border-radius-xl: 24px;
            --border-radius-xxl: 32px;
            --transition-all: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

            /* Glass & Inputs */
            --glass-bg: var(--bg-card);
            --glass-border: var(--card-border);
            --input-bg: rgba(0, 0, 0, 0.6);
            --primary-gradient: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            --text-main: var(--text-primary);
            --text-muted: var(--text-secondary);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: var(--bg-body);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        body::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 120%;
            background-image: radial-gradient(circle, rgba(0, 163, 224, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 350px;
            width: 90%;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--border-radius-xxl);
            padding: 25px 35px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-sm);
            margin: auto;
            position: relative;
            z-index: 1;
        }

        .pwa-install-prompt {
            position: fixed;
            top: -100px;
            left: 0;
            width: 100%;
            background: rgba(19, 19, 19, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--card-border);
            color: var(--text-primary);
            z-index: 9999;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: top 0.5s var(--transition-all);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .pwa-install-prompt.show {
            top: 0;
        }

        .pwa-text {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .pwa-highlight {
            color: var(--primary);
            font-weight: bold;
        }

        .pwa-close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-primary);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-right: 15px;
            transition: background 0.2s;
        }

        .pwa-close-btn:hover {
            background: rgba(0, 229, 255, 0.3);
        }

        .pwa-close-btn svg {
            width: 14px;
            height: 14px;
            fill: var(--text-primary);
        }

        .logo {
            font-weight: 900;
            font-size: 36px;
            background: linear-gradient(90deg, var(--primary), var(--text-primary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.4));
            display: inline-block;
            font-family: 'Inter', sans-serif;
        }

        .subtitle {
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 5px;
            opacity: 0.8;
        }

        .form .input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid #333;
            padding: 15px 20px;
            border-radius: 15px;
            margin-top: 15px;
            font-size: 16px;
            text-align: center;
            color: var(--text-primary);
            font-weight: 600;
            transition: all 0.3s ease;
            outline: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form .input:focus {
            border-color: var(--primary);
            background: #000000;
            box-shadow: 0 0 0 4px rgba(0, 229, 255, 0.15);
        }

        .form .forgot-password a {
            font-size: 13px;
            color: var(--primary);
            text-decoration: none;
            cursor: pointer;
            font-weight: 600;
        }

        .form .forgot-password a:hover {
            color: #00FFF0;
        }

        .form .login-button {
            display: block;
            width: 100%;
            font-weight: bold;
            background: var(--primary-gradient);
            color: var(--text-primary);
            padding-block: 15px;
            margin: 20px auto;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 229, 255, 0.4);
            border: none;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            font-size: 16px;
            position: relative;
            overflow: hidden;
        }

        .form .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(0, 229, 255, 0.5);
        }

        .social-account-container .social-accounts .social-button:hover {
            background: var(--primary-gradient);
        }

        .social-button:hover .svg {
            fill: var(--text-primary);
        }

        .agreement a:hover {
            color: var(--primary);
        }

        .error-message {
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 0.85rem;
            text-align: center;
            display: none;
            width: 100%;
            font-weight: 600;
            backdrop-filter: blur(5px);
            font-family: 'Cairo', sans-serif;
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid rgba(0, 163, 224, 0.2);
            color: #00E5FF;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px; 
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

        </button>

    <script src="js/config.local.js" onload="console.log('Local config loaded')" onerror="console.log('Using default config')"></script>

    <script>
        function checkPWAInstall() {
            const isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
            const wasPromptClosed = localStorage.getItem('pwaPromptClosed');
            if (isiOS && !isStandalone && wasPromptClosed !== 'true') {
                const prompt = document.getElementById('pwaPrompt');
                setTimeout(() => { prompt.classList.add('show'); }, 1000);
                setTimeout(() => { dismissPWA(); }, 9000); 
            }
        }

        function dismissPWA() {
            const prompt = document.getElementById('pwaPrompt');
            prompt.classList.remove('show');
            localStorage.setItem('pwaPromptClosed', 'true');
        }

        window.addEventListener('DOMContentLoaded', () => {
            checkPWAInstall();
            elements.licenseKey.focus();
        });

        const elements = {
            loginForm: document.getElementById('loginForm'),
            licenseKey: document.getElementById('licenseKey'),
            submitBtn: document.getElementById('submitBtn'),
            btnText: document.getElementById('btnText'),
            errorMessage: document.getElementById('errorMessage'),
            successMessage: document.getElementById('successMessage')
        };

        elements.loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const licenseKey = elements.licenseKey.value.trim();
            if (!licenseKey) { showError('الرجاء إدخال مفتاح التفعيل'); return; }
            elements.submitBtn.disabled = true;
            elements.btnText.innerHTML = 'جاري التحقق <span class="loading-spinner"></span>';
            try {
                const result = await auth.login(licenseKey);
                if (result.success) {
                    elements.btnText.innerHTML = جاري تسجيل الدخول!';
                    elements.submitBtn.style.background = 'var(--primary-gradient)';
                    showSuccess('تم تسجيل الدخول بنجاح! جاري التوجيه...');
                    setTimeout(() => { window.location.href = 'index.html'; }, 1500);
                } else {
                    showError(result.error || 'المفتاح غير صحيح');
                    elements.submitBtn.disabled = false;
                    elements.btnText.textContent = 'ت
