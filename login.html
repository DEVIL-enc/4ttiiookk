<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <title>RESIST TIK</title>
    <link rel="manifest" href="/manifest.json">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;600;900&display=swap" rel="stylesheet">

    <style>
       
        :root {
            --glass-bg: rgba(20, 20, 20, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(0, 0, 0, 0.6);
            --primary-gradient: linear-gradient(135deg, #FF3EA5 0%, #6420AA 100%);
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: #000000;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        body::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 120%;
            background-image: radial-gradient(circle, rgba(100, 32, 170, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 350px;
            width: 90%;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 25px 35px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            margin: auto;
            position: relative;
            z-index: 1;
        }

       
        .pwa-install-prompt {
            position: fixed;
            top: -100px;
            left: 0;
            width: 100%;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            z-index: 9999;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: top 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .pwa-install-prompt.show {
            top: 0;
        }

        .pwa-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .pwa-text {
            font-size: 13px;
            color: #ddd;
            line-height: 1.4;
        }

        .pwa-highlight {
            color: #FF3EA5;
            font-weight: bold;
        }

        .pwa-close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-right: 15px;
            transition: background 0.2s;
        }

        .pwa-close-btn:hover {
            background: rgba(255, 62, 165, 0.3);
        }

        .pwa-close-btn svg {
            width: 14px;
            height: 14px;
            fill: #fff;
        }
      

        .logo-container {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        .logo {
    font-weight: 900;
    font-size: 36px;
    background: linear-gradient(90deg, #00E5FF, #00A3E0); /* أزرق */
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
    filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.5)); /* نيون أزرق خفيف */
    display: inline-block;
    font-family: 'Inter', sans-serif;
}

        .subtitle {
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 5px;
            opacity: 0.8;
        }

        .form .input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid #ffffff;
            padding: 15px 20px;
            border-radius: 15px;
            margin-top: 15px;
            font-size: 16px;
            text-align: center;
            color: #ffffff;
            font-weight: 600;
            transition: all 0.3s ease;
            outline: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form .input:focus {
            border-color: #00E5FF;
            background: #000000;
            box-shadow: 0 0 0 4px rgba(255, 62, 165, 0.15);
        }

        .form .input::placeholder {
            color: #666;
            font-family: 'Cairo', sans-serif;
            text-transform: none;
        }

        .form .forgot-password {
            display: block;
            margin-top: 12px;
            text-align: center;
        }

        .form .forgot-password a {
    font-size: 13px;
    color: #ffffff; /* أبيض */
    text-decoration: none;
    cursor: pointer;
    font-weight: 600;
    transition: color 0.3s ease;
    font-family: 'Cairo', sans-serif;
}

.form .forgot-password a:hover {
    color: #00E5FF; /* أزرق عند hover */
}

        .form .forgot-password a:hover {
            color: #FF7ED4;
        }

        .form .login-button {
    display: block;
    width: 100%;
    font-weight: bold;
    background: linear-gradient(135deg, #00E5FF 0%, #00A3E0 100%); /* أزرق gradient */
    color: #f8fafc; /* نص أبيض */
    padding-block: 15px;
    margin: 20px auto;
    border-radius: 20px;
    box-shadow: 0 10px 25px -5px rgba(0, 229, 255, 0.4); /* نيون خفيف */
    border: none;
    transition: all 0.2s ease-in-out;
    cursor: pointer;
    font-size: 16px;
    position: relative;
    overflow: hidden;
    font-family: 'Cairo', sans-serif;
    text-shadow: 0 0 8px rgba(0, 229, 255, 0.7); /* نيون على النص */
}

.form .login-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 20px rgba(0, 229, 255, 0.7); /* نيون أقوى عند hover */
}

.form .login-button:active {
    transform: translateY(0);
}

        .social-account-container {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--glass-border);
        }

        .social-account-container .title {
            display: block;
            text-align: center;
            font-size: 11px;
            color: #666;
            margin-bottom: 10px;
            font-family: 'Cairo', sans-serif;
        }

        .social-account-container .social-accounts {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 5px;
        }

        .social-account-container .social-accounts .social-button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 5px;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }

        .social-account-container .social-accounts .social-button:hover {
            background: var(--primary-gradient);
            border-color: transparent;
            transform: scale(1.1);
        }

        .social-account-container .social-accounts .social-button .svg {
            fill: #9ca3af;
            width: 18px;
            height: 18px;
        }

        .social-button:hover .svg {
            fill: #ffffff;
        }

        .agreement {
            display: block;
            text-align: center;
            margin-top: 15px;
        }

        .agreement a {
            text-decoration: none;
            color: #666;
            font-size: 10px;
            font-weight: 600;
            transition: color 0.3s ease;
            font-family: 'Cairo', sans-serif;
        }

        .agreement a:hover {
            color: #FF3EA5;
        }
        
        .error-message, .success-message {
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 0.85rem;
            text-align: center;
            display: none;
            width: 100%;
            font-weight: 600;
            backdrop-filter: blur(5px);
            font-family: 'Cairo', sans-serif;
        }

        .error-message {
            background: rgba(255, 50, 50, 0.1);
            border: 1px solid rgba(255, 50, 50, 0.2);
            color: #ff8080;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px; 
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

  
    <div id="pwaPrompt" class="pwa-install-prompt">
        <div class="pwa-content">
            <span class="pwa-text">لتثبيت التطبيق ، اضغط على زر المشاركة في المتصفح  <span class="pwa-highlight">⬆️</span> ثم <span class="pwa-highlight">إضافة للشاشة الرئيسية</span></span>
        </div>
        <button class="pwa-close-btn" onclick="dismissPWA()">
            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
    </div>

    <div class="container">
        <div class="logo-container">
            <div class="logo">RESIST TIK</div>
            <div class="subtitle">Made by RESIST</div>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <form class="form" id="loginForm">
            <input 
                type="text" 
                id="licenseKey" 
                class="input" 
                placeholder="أدخل مفتاح التفعيل" 
                autocomplete="off"
                dir="ltr" 
                required
            >
            
            <span class="forgot-password"> 
                <a href="https://t.me/Ds1_RESIST" target="_blank">شراء كود اشتراك ؟</a>
            </span>
            
            <button type="submit" class="login-button" id="submitBtn">
                <span id="btnText">تسجيل الدخول</span>
            </button>
        </form>

        <div class="social-account-container">
            <span class="title">قريبا تسجيل الدخول عبر</span>
            <div class="social-accounts">
                <button class="social-button google">
                    <svg viewBox="0 0 488 512" class="svg" xmlns="http://www.w3.org/2000/svg">
                        <path d="M488 261.8C488 403.3 391.1 504 248 504 110.8 504 0 393.2 0 256S110.8 8 248 8c66.8 0 123 24.5 166.3 64.9l-67.5 64.9C258.5 52.6 94.3 116.6 94.3 256c0 86.5 69.1 156.6 153.7 156.6 98.2 0 135-70.4 140.8-106.9H248v-85.3h236.1c2.3 12.7 3.9 24.9 3.9 41.4z"></path>
                    </svg>
                </button>
                <button class="social-button apple">
                    <svg viewBox="0 0 384 512" class="svg" xmlns="http://www.w3.org/2000/svg">
                        <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"></path>
                    </svg>
                </button>
                <button class="social-button twitter">
                    <svg viewBox="0 0 512 512" class="svg" xmlns="http://www.w3.org/2000/svg">
                        <path d="M389.2 48h70.6L305.6 224.2 487 464H345L233.7 318.6 106.5 464H35.8L200.7 275.5 26.8 48H172.4L272.9 180.9 389.2 48zM364.4 421.8h39.1L151.1 88h-42L364.4 421.8z"></path>
                    </svg>
                </button>
            </div>
        </div>
        <span class="agreement"><a href="#">قراءة اتفاقية ترخيص المستخدم</a></span>
    </div>

   
    <script src="js/config.local.js" onload="console.log('Local config loaded')" onerror="console.log('Using default config')"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/fingerprint.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

  
    <script>
      
        function checkPWAInstall() {
          
            const isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            
           
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;

          
            const wasPromptClosed = localStorage.getItem('pwaPromptClosed');

          
            if (isiOS && !isStandalone && wasPromptClosed !== 'true') {
                const prompt = document.getElementById('pwaPrompt');
                
               
                setTimeout(() => {
                    prompt.classList.add('show');
                }, 1000);

              
                setTimeout(() => {
                    dismissPWA();
                }, 9000); 
            }
        }

        function dismissPWA() {
            const prompt = document.getElementById('pwaPrompt');
            prompt.classList.remove('show');
           
            localStorage.setItem('pwaPromptClosed', 'true');
        }

       
        window.addEventListener('DOMContentLoaded', () => {
            checkPWAInstall();
            elements.licenseKey.focus();
        });

       
        const elements = {
            loginForm: document.getElementById('loginForm'),
            licenseKey: document.getElementById('licenseKey'),
            submitBtn: document.getElementById('submitBtn'),
            btnText: document.getElementById('btnText'),
            errorMessage: document.getElementById('errorMessage'),
            successMessage: document.getElementById('successMessage')
        };

        elements.loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const licenseKey = elements.licenseKey.value.trim();
            if (!licenseKey) {
                showError('الرجاء إدخال مفتاح التفعيل');
                return;
            }

            elements.submitBtn.disabled = true;
            elements.btnText.innerHTML = 'جاري التحقق <span class="loading-spinner"></span>';

            try {
                const result = await auth.login(licenseKey);

                if (result.success) {
                    elements.btnText.innerHTML = 'تم التحقق بنجاح!';
                    elements.submitBtn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
                    
                    showSuccess('تم تسجيل الدخول بنجاح! جاري التوجيه...');
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    showError(result.error || 'المفتاح غير صحيح');
                    elements.submitBtn.disabled = false;
                    elements.btnText.textContent = 'تسجيل الدخول';
                    elements.licenseKey.focus();
                }
            } catch (error) {
                showError('حدث خطأ غير متوقع. حاول مرة أخرى');
                elements.submitBtn.disabled = false;
                elements.btnText.textContent = 'تسجيل الدخول';
            }
        });

        function showError(message) {
            elements.errorMessage.textContent = message;
            elements.errorMessage.style.display = 'block';
            elements.successMessage.style.display = 'none';
            setTimeout(() => {
                elements.errorMessage.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            elements.successMessage.textContent = message;
            elements.successMessage.style.display = 'block';
            elements.errorMessage.style.display = 'none';
            setTimeout(() => {
                elements.successMessage.style.display = 'none';
            }, 5000);
        }

        elements.licenseKey.addEventListener('input', (e) => {
            const formatted = auth.formatLicenseKey(e.target.value);
            e.target.value = formatted;
        });
    </script>
</body>
</html>
